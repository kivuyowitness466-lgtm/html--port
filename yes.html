<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    

    <style>
        body {
            background-color: #F3E9F9;
            font-family: "Quicksand", sans-serif;
            margin: 0;
            padding: 10px; /* Safe padding for tiny viewport screen edges */
        }

        section {
            background-color: #D8B4F8;
            width: 100%;             /* 1. Fluid horizontal base */
            max-width: 800px;        /* 2. Locks maximum size on laptop/monitors */
            min-height: 550px;       /* 3. Uses a fluid vertical minimum instead of hard height */
            height: auto;            /* Standard behavior allowing room to flex vertically */
            border-radius: 20px;
            margin: 50px auto;
            padding: 40px 20px;      /* Consistent protective content spacing padding */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Keeps headers/image perfectly grouped in the center */
        }

        img {
            width: 100%;             /* Scales fluidly down on small devices */
            max-width: 300px;        /* Prevents image stretching too wide on desktop */
            height: auto;            /* Maintains normal aspect ratio proportions */
            display: block;
            margin: auto;
            border-radius: 20px;
        }

        section h1, section h3 {
            color: #4A154B;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        section h1 {
            font-size: 2rem;        /* Fluid desktop font scaling base */
        }

        section h3 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        .button-container {
            text-align: center;
            margin-top: 20px; 
        }

        a {
            text-decoration: none;
            display: inline-block; 
            color: black;
            padding: 12px 30px;     /* Comfortable touch surface tracking area */
            background-color: palevioletred;
            border-radius: 15px;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        a:hover {
            transform: scale(1.05); /* Interactive pop feedback */
        }

        /* --- 📱 MOBILE VIEWPADDING BREAKPOINT --- */
        @media (max-width: 480px) {
            section {
                margin: 20px auto;  /* Cleaner, compressed spacing constraints on mobile */
                padding: 30px 15px;
            }

            img {
                max-width: 220px;   /* Pulls image size down slightly to keep text highly visible */
            }

            section h1 {
                font-size: 1.5rem;  /* Keeps the massive header text on fewer rows */
                margin-bottom: 15px;
            }

            section h3 {
                font-size: 1.1rem;
            }

            a {
                width: 70%;         /* Widens button slightly on mobile so it is effortless to tap */
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<section>
    <div>
        <img src="images/zoo.jpg" alt="Zoo illustration">
    </div>
    <div>
        <h1>WAIT YOU ACTUALLY SAID YES??😭😭</h1> 
        <h3>I was so ready for you to say no😂</h3>
        
        <div class="button-container">
            <a href="okay.html">okay okay ➝</a>
        </div>
    </div>
</section>

</body>
</html>
